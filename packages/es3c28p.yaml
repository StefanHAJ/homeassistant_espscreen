# ESP Screens - the package a LCDWiki ES3C28P builds from over GitHub.
substitutions:
  GITHUB_REF: "main"
  FONT_DIR: "https://raw.githubusercontent.com/MaxGramser/homeassistant_espscreen/${GITHUB_REF}/fonts"

packages:
  core: !include core.yaml
  board: !include boards/es3c28p.yaml
  hotspot: !include features/hotspot.yaml

external_components:
  - source:
      type: git
      url: https://github.com/MaxGramser/homeassistant_espscreen.git
      ref: ${GITHUB_REF}
      path: components
    refresh: 0s
    components: [smart_display]
